<div class="task-list-container">
  <div *ngIf="tasks.length === 0" class="empty-state">
    No tasks yet. Add something to spark your day! ⚡
  </div>

  <ul *ngIf="tasks.length > 0" class="task-list">
    <li *ngFor="let task of tasks" [class.completed]="task.completed">
      <div class="task-content">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleComplete(task)" />

        <div class="task-details">
          <h3>{{ task.title }}</h3>
          <p *ngIf="task.description">{{ task.description }}</p>
          <div class="task-tags">
            <span class="tag" [style.background]="getEnergyColor(task.energy)">
              Energy: {{ task.energy }}
            </span>
            <span class="tag">Avoidance: {{ task.avoidance }}</span>
            <span class="tag" *ngIf="task.dopamineHit">🔥 Dopamine Hit</span>
          </div>
        </div>
      </div>

      <button (click)="deleteTask(task.id)" class="delete-btn">🗑️</button>
    </li>
  </ul>
</div>
