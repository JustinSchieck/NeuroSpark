<div class="task-form">
  <h2>Create a New Task</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title:</label>
      <input
        id="title"
        type="text"
        [(ngModel)]="task.title"
        name="title"
        required
        placeholder="Task title"
        (input)="onInputChange()" />
    </div>

    <div class="form-group">
      <label for="description">Description:</label>
      <textarea
        id="description"
        [(ngModel)]="task.description"
        name="description"
        placeholder="Task description"
        (input)="onInputChange()"></textarea>
    </div>

    <div class="form-group">
      <label for="energy">Energy Level:</label>
      <select
        id="energy"
        [(ngModel)]="task.energy"
        name="energy"
        required
        (change)="onInputChange()">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>

    <div class="form-group">
      <label for="avoidance">Avoidance (1-5):</label>
      <input
        id="avoidance"
        type="number"
        [(ngModel)]="task.avoidance"
        name="avoidance"
        min="1"
        max="5"
        required
        (input)="onInputChange()"/>
    </div>

    <div class="form-group">
      <label for="dopamineHit">
        <input
          id="dopamineHit"
          type="checkbox"
          [(ngModel)]="task.dopamineHit"
          name="dopamineHit"
          (change)="onInputChange()" />
        Dopamine Hit
      </label>
    </div>

    <button type="submit">Save Task</button>
  </form>

  <button (click)="resetForm()">Clear Form</button>
</div>
