<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>🧠 NeuroSpark</h1>
    <p class="subtitle">Organize tasks by energy, focus, and dopamine.</p>
  </header>

  <section class="task-controls">
    <app-task-form (taskSubmitted)="handleNewTask($event)"></app-task-form>
  </section>

  <section class="task-list">
    <app-task-list
      [tasks]="tasks"
      (taskUpdated)="onTaskUpdated($event)"
      (taskDeleted)="onTaskDeleted($event)">
    </app-task-list>
  </section>
</div>
